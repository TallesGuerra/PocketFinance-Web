<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Dark background with rounded corners (for in-app use) -->
  <rect width="512" height="512" rx="112" fill="#0a1628"/>

  <!-- Subtle radial glow -->
  <radialGradient id="glow" cx="50%" cy="45%" r="55%">
    <stop offset="0%" stop-color="#0d9488" stop-opacity="0.35"/>
    <stop offset="100%" stop-color="#0a1628" stop-opacity="0"/>
  </radialGradient>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>

  <!-- Shield shape -->
  <path d="M256 80 L380 130 L380 270 C380 340 330 395 256 432 C182 395 132 340 132 270 L132 130 Z"
    fill="none" stroke="#0d9488" stroke-width="10" opacity="0.6"/>
  <path d="M256 100 L364 146 L364 268 C364 330 320 380 256 414 C192 380 148 330 148 268 L148 146 Z"
    fill="#06545e" opacity="0.5"/>

  <!-- Upward chart line -->
  <polyline points="172,320 220,265 268,290 340,200"
    fill="none" stroke="#10b981" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Arrow head at end of line -->
  <polygon points="340,200 310,196 326,222"
    fill="#10b981"/>

  <!-- Gold coin circle -->
  <circle cx="196" cy="320" r="28" fill="#d89a18"/>
  <circle cx="196" cy="320" r="22" fill="#f0b429"/>
  <text x="196" y="328" text-anchor="middle" font-family="Georgia, serif" font-weight="bold"
    font-size="22" fill="#7a4f00">€</text>

  <!-- White P letterform -->
  <text x="268" y="330" text-anchor="middle" font-family="Arial Black, sans-serif" font-weight="900"
    font-size="72" fill="white" opacity="0.15">P</text>

  <!-- Green leaf dots at top of shield -->
  <circle cx="230" cy="110" r="6" fill="#10b981" opacity="0.7"/>
  <circle cx="256" cy="104" r="7" fill="#10b981" opacity="0.85"/>
  <circle cx="282" cy="110" r="6" fill="#10b981" opacity="0.7"/>
</svg>
