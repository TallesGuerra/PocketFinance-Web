<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d6b5e"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#0d9488" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0a1628" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Dark background -->
  <rect width="512" height="512" rx="110" fill="#0a1628"/>
  <rect width="512" height="512" rx="110" fill="url(#bgGlow)"/>

  <!-- Shield fill -->
  <path d="M256 68 L392 122 L392 276 C392 354 334 408 256 444 C178 408 120 354 120 276 L120 122 Z"
    fill="url(#shieldGrad)"/>

  <!-- Shield border -->
  <path d="M256 68 L392 122 L392 276 C392 354 334 408 256 444 C178 408 120 354 120 276 L120 122 Z"
    fill="none" stroke="#10b981" stroke-width="6" opacity="0.7"/>

  <!-- Upward chart line -->
  <polyline points="158,330 210,268 262,292 346,196"
    fill="none" stroke="#10b981" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Arrowhead -->
  <polygon points="346,196 312,190 328,220" fill="#10b981"/>

  <!-- Gold coin -->
  <circle cx="186" cy="332" r="34" fill="#92400e"/>
  <circle cx="186" cy="332" r="28" fill="#f59e0b"/>
  <circle cx="186" cy="332" r="22" fill="#fbbf24"/>
  <text x="186" y="342" text-anchor="middle"
    font-family="Georgia, serif" font-weight="bold" font-size="26" fill="#78350f">€</text>

  <!-- Green accent dots at top of shield -->
  <circle cx="220" cy="108" r="7" fill="#34d399" opacity="0.8"/>
  <circle cx="256" cy="100" r="9" fill="#10b981"/>
  <circle cx="292" cy="108" r="7" fill="#34d399" opacity="0.8"/>
</svg>
