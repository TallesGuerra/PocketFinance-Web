<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2027"/>
      <stop offset="100%" stop-color="#0a1628"/>
    </linearGradient>
    <linearGradient id="circle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>

  <!-- Emerald circle -->
  <circle cx="256" cy="226" r="140" fill="url(#circle)"/>

  <!-- White "P" letter centered in circle -->
  <text x="256" y="295"
    text-anchor="middle"
    font-family="Arial Black, Helvetica Neue, sans-serif"
    font-weight="900"
    font-size="190"
    fill="white"
    letter-spacing="-4">P</text>

  <!-- Upward arrow chart line at bottom -->
  <polyline points="128,440 196,388 256,408 340,360 384,360"
    fill="none" stroke="url(#arrow)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Arrowhead -->
  <polygon points="384,360 360,348 360,372" fill="#6ee7b7"/>
</svg>
