<svg width="320" height="660" viewBox="0 0 320 660" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="phoneBg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <clipPath id="screenClip2">
      <rect x="18" y="60" width="284" height="548" rx="4"/>
    </clipPath>
    <filter id="shadow2">
      <feDropShadow dx="0" dy="8" stdDeviation="20" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Phone shadow -->
  <rect x="6" y="6" width="308" height="648" rx="48" fill="#000" opacity="0.4" filter="url(#shadow2)"/>

  <!-- Phone body -->
  <rect x="2" y="2" width="316" height="656" rx="48" fill="url(#phoneBg2)" stroke="#374151" stroke-width="1.5"/>
  <rect x="8" y="8" width="304" height="644" rx="44" fill="#111827" stroke="#1f2937" stroke-width="1"/>

  <!-- Side buttons -->
  <rect x="0" y="140" width="4" height="36" rx="2" fill="#374151"/>
  <rect x="0" y="186" width="4" height="36" rx="2" fill="#374151"/>
  <rect x="316" y="162" width="4" height="52" rx="2" fill="#374151"/>

  <!-- Screen -->
  <rect x="18" y="60" width="284" height="548" fill="#0f172a"/>

  <!-- Dynamic island -->
  <rect x="120" y="18" width="80" height="26" rx="13" fill="#060d15"/>

  <g clip-path="url(#screenClip2)">
    <!-- Header gradient -->
    <rect x="18" y="60" width="284" height="210" fill="url(#headerGrad)"/>

    <!-- Status bar -->
    <text x="34" y="88" font-size="12" font-weight="600" fill="white">12:03</text>
    <text x="286" y="88" font-size="12" fill="white" text-anchor="end">5G ▮▮▮</text>

    <!-- Title row -->
    <text x="34" y="118" font-size="16" font-weight="700" fill="white">💰  PocketFinance</text>
    <!-- Sun + Plus buttons -->
    <rect x="238" y="104" width="30" height="30" rx="10" fill="rgba(255,255,255,0.2)"/>
    <text x="253" y="124" font-size="14" text-anchor="middle" fill="white">☀</text>
    <rect x="272" y="104" width="30" height="30" rx="10" fill="rgba(255,255,255,0.2)"/>
    <text x="287" y="124" font-size="18" text-anchor="middle" fill="white">+</text>

    <!-- Month picker -->
    <text x="84" y="158" font-size="13" fill="rgba(255,255,255,0.7)">‹</text>
    <text x="160" y="158" font-size="13" font-weight="600" text-anchor="middle" fill="white">Março De 2026</text>
    <text x="236" y="158" font-size="13" fill="rgba(255,255,255,0.7)">›</text>

    <!-- Summary cards -->
    <rect x="26" y="168" width="82" height="56" rx="14" fill="rgba(255,255,255,0.15)"/>
    <text x="67" y="185" font-size="8" text-anchor="middle" fill="rgba(255,255,255,0.8)">↗  Receitas</text>
    <text x="67" y="212" font-size="12" font-weight="700" text-anchor="middle" fill="white">2.250 €</text>

    <rect x="116" y="168" width="82" height="56" rx="14" fill="rgba(255,255,255,0.15)"/>
    <text x="157" y="185" font-size="8" text-anchor="middle" fill="rgba(255,255,255,0.8)">↘  Despesas</text>
    <text x="157" y="212" font-size="12" font-weight="700" text-anchor="middle" fill="white">1.155 €</text>

    <rect x="206" y="168" width="82" height="56" rx="14" fill="rgba(255,255,255,0.15)"/>
    <text x="247" y="185" font-size="8" text-anchor="middle" fill="rgba(255,255,255,0.8)">⊟  Saldo</text>
    <text x="247" y="212" font-size="12" font-weight="700" text-anchor="middle" fill="white">1.095 €</text>

    <!-- Content area bg -->
    <rect x="18" y="270" width="284" height="338" fill="#0f172a"/>

    <!-- Toggle -->
    <rect x="26" y="278" width="268" height="36" rx="12" fill="#1e293b"/>
    <rect x="29" y="281" width="130" height="30" rx="10" fill="#334155"/>
    <text x="94" y="301" font-size="12" font-weight="600" text-anchor="middle" fill="white">Histórico</text>
    <text x="228" y="301" font-size="12" text-anchor="middle" fill="#64748b">Por categoria</text>

    <!-- Date label 1 -->
    <text x="30" y="336" font-size="10" fill="#475569">19/03/2026</text>

    <!-- Transaction 1 - unpaid -->
    <rect x="26" y="342" width="268" height="54" rx="14" fill="#1e293b"/>
    <circle cx="50" cy="369" r="12" fill="transparent" stroke="#334155" stroke-width="2"/>
    <rect x="68" y="356" width="28" height="28" rx="8" fill="#f59e0b18"/>
    <text x="82" y="375" font-size="16" text-anchor="middle">🍽️</text>
    <text x="106" y="363" font-size="11" font-weight="600" fill="white">Almoço com colegas</text>
    <text x="106" y="378" font-size="9" fill="#64748b">Restaurantes  </text>
    <rect x="153" y="373" width="38" height="14" rx="7" fill="#7f1d1d"/>
    <text x="172" y="383" font-size="8" font-weight="600" text-anchor="middle" fill="#fca5a5">Vencida</text>
    <text x="282" y="369" font-size="11" font-weight="600" text-anchor="end" fill="#ef4444">-42,00 €</text>

    <!-- Date label 2 -->
    <text x="30" y="414" font-size="10" fill="#475569">16/03/2026</text>

    <!-- Transaction 2 - paid -->
    <rect x="26" y="420" width="268" height="54" rx="14" fill="#1e293b"/>
    <circle cx="50" cy="447" r="12" fill="#059669"/>
    <text x="50" y="452" font-size="12" text-anchor="middle" fill="white">✓</text>
    <rect x="68" y="434" width="28" height="28" rx="8" fill="#14b8a618"/>
    <text x="82" y="453" font-size="16" text-anchor="middle">🛒</text>
    <text x="106" y="441" font-size="11" font-weight="500" fill="#64748b">Pingo Doce</text>
    <text x="106" y="456" font-size="9" fill="#10b981">Pago em 16/03/2026</text>
    <text x="282" y="447" font-size="11" font-weight="600" text-anchor="end" fill="#64748b">-74,00 €</text>

    <!-- Date label 3 -->
    <text x="30" y="492" font-size="10" fill="#475569">14/03/2026</text>

    <!-- Transaction 3 - income -->
    <rect x="26" y="498" width="268" height="54" rx="14" fill="#1e293b"/>
    <rect x="68" y="512" width="28" height="28" rx="8" fill="#10b98118"/>
    <text x="82" y="531" font-size="16" text-anchor="middle">💻</text>
    <text x="106" y="519" font-size="11" font-weight="500" fill="#64748b">Freelance — Site E-com...</text>
    <text x="106" y="534" font-size="9" fill="#10b981">Pago em 14/03/2026</text>
    <text x="282" y="525" font-size="11" font-weight="600" text-anchor="end" fill="#10b981">+400,00 €</text>

    <!-- Bottom nav -->
    <rect x="18" y="575" width="284" height="33" fill="#0a0f1e"/>
    <line x1="18" y1="575" x2="302" y2="575" stroke="#1e293b" stroke-width="1"/>

    <text x="52" y="591" font-size="16" text-anchor="middle" fill="#10b981">⊞</text>
    <text x="52" y="603" font-size="8" text-anchor="middle" fill="#10b981">Início</text>

    <text x="100" y="591" font-size="14" text-anchor="middle" fill="#475569">⇆</text>
    <text x="100" y="603" font-size="8" text-anchor="middle" fill="#475569">Transações</text>

    <text x="160" y="591" font-size="14" text-anchor="middle" fill="#475569">↺</text>
    <text x="160" y="603" font-size="8" text-anchor="middle" fill="#475569">Recorrentes</text>

    <text x="220" y="591" font-size="14" text-anchor="middle" fill="#475569">◫</text>
    <text x="220" y="603" font-size="8" text-anchor="middle" fill="#475569">Poupança</text>

    <text x="268" y="591" font-size="14" text-anchor="middle" fill="#475569">◈</text>
    <text x="268" y="603" font-size="8" text-anchor="middle" fill="#475569">Categorias</text>
  </g>

  <!-- Home indicator -->
  <rect x="130" y="634" width="60" height="4" rx="2" fill="#374151"/>
</svg>
